name: SonarQube Scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  scan:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Restore extensions cache
        uses: actions/cache@v6
        id: extensions-cache
        with:
          path: ~/.scanwise/extensions
          key: scanwise-extensions-${{ runner.os }}
      - name: Scanwise Scan
        uses: VIDADv1/scanwise@0407ab88200ab74d6289269e4211ffda55ad1763 # v1
        with:
          sonar-source-path: "."
          sonar-project-name: "pi-extensions"
          sonar-project-key: "pi-extensions"
          generate-pr-comment: true
          new-code-n-days: "3d"
          reports-scopes: '["overall", "new"]'
          reports-extensions: '["md", "html"]'
          reports-retention-days: "7"
          sonar-options: "-Dsonar.exclusions=node_modules/**,target/**,coverage/**,**/*.lock,**/dist/**,crates/**"
  clippy:
    name: Clippy (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
