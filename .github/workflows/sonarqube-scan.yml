name: SonarQube Scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  clippy:
    name: Clippy (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup - Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --message-format=json > clippy-report.json
      - name: Upload - Clippy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clippy-report
          path: clippy-report.json
  scan:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: clippy
    # Elevated permissions allow the scan action to comment on pull requests and issues.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Restore extensions cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: extensions-cache
        with:
          path: ~/.scanwise/extensions
          key: scanwise-extensions-${{ runner.os }}
      - name: Download - Clippy report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: clippy-report
      - name: Scan - SonarQube
        uses: VIDADv1/scanwise@0407ab88200ab74d6289269e4211ffda55ad1763 # v1
        with:
          sonar-source-path: "."
          sonar-project-name: "pi-extensions"
          sonar-project-key: "pi-extensions"
          generate-pr-comment: true
          new-code-n-days: "3d"
          reports-scopes: '["overall", "new"]'
          reports-extensions: '["md", "html"]'
          reports-retention-days: "7"
          sonar-options: "-Dsonar.exclusions=node_modules/**,target/**,coverage/**,**/*.lock,**/dist/** -Dsonar.rust.clippy.reportPaths=clippy-report.json -Dsonar.issue.ignore.multicriteria=s6606 -Dsonar.issue.ignore.multicriteria.s6606.ruleKey=typescript:S6606 -Dsonar.issue.ignore.multicriteria.s6606.resourceKey=**/*"
