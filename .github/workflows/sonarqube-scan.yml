name: SonarQube Scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  clippy:
    name: Clippy (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup - Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --message-format=json > clippy-report.json
      - name: Upload - Clippy report
        uses: actions/upload-artifact@v7
        with:
          name: clippy-report
          path: clippy-report.json
  scan:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: clippy
    steps:
      - name: Restore extensions cache
        uses: actions/cache@v6
        id: extensions-cache
        with:
          path: ~/.scanwise/extensions
          key: scanwise-extensions-${{ runner.os }}
      - name: Download - Clippy report
        uses: actions/download-artifact@v8
        with:
          name: clippy-report
      - name: Scan - SonarQube
        uses: VIDADv1/scanwise@0407ab88200ab74d6289269e4211ffda55ad1763 # v1
        with:
          sonar-source-path: "."
          sonar-project-name: "pi-extensions"
          sonar-project-key: "pi-extensions"
          generate-pr-comment: true
          new-code-n-days: "3d"
          reports-scopes: '["overall", "new"]'
          reports-extensions: '["md", "html"]'
          reports-retention-days: "7"
          sonar-options: "-Dsonar.exclusions=node_modules/**,target/**,coverage/**,**/*.lock,**/dist/** -Dsonar.rust.clippy.reportPaths=clippy-report.json -Dsonar.issue.ignore.multicriteria=s6606 -Dsonar.issue.ignore.multicriteria.s6606.ruleKey=typescript:S6606 -Dsonar.issue.ignore.multicriteria.s6606.resourceKey=**/*"
